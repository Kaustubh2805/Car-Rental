{% extends "base.html" %}

{% block title %}Create account | Car Rental{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <h1 class="h2 mb-4">Create a customer account</h1>
      <form method="post" novalidate>
        {% csrf_token %}
        {% if request.GET.next %}
          <input type="hidden" name="next" value="{{ request.GET.next }}">
        {% endif %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Create account</button>
      </form>
      <p class="mt-3">
        Already registered? <a href="{% url 'accounts:login' %}">Sign in</a>
      </p>
    </div>
  </div>
{% endblock %}
